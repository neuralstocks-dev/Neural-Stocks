name: RF retrain (weekly)

# Monday 04:00 UTC. Trains the Random Forest on the latest 5y of data,
# runs a sanity check on the saved artifact, and publishes the freshly-
# trained model + metadata as a workflow artifact. Also viewable via the
# Actions summary so ops can eyeball the holdout metrics at a glance.

on:
  schedule:
    - cron: "0 4 * * 1"  # weekly, Monday 04:00 UTC
  workflow_dispatch:
    inputs:
      years:
        description: "Years of history"
        default: "5"
        required: false
      horizon:
        description: "Forward-return horizon (trading days)"
        default: "20"
        required: false

concurrency:
  group: rf-retrain
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install training-only deps
        # Keep this list minimal — we don't need the full backend runtime
        # for an offline retrain. Versions intentionally loose.
        run: |
          python -m pip install --upgrade pip
          pip install \
            "yfinance>=0.2.40" \
            "pandas>=2.2" \
            "numpy>=1.26" \
            "scikit-learn>=1.8" \
            "scipy>=1.14" \
            "joblib>=1.4"

      - name: Train
        working-directory: backend
        run: |
          YEARS="${{ github.event.inputs.years || '5' }}"
          HORIZON="${{ github.event.inputs.horizon || '20' }}"
          echo "▸ Training RF · years=$YEARS · horizon=$HORIZON"
          python scripts/train_rf.py --years "$YEARS" --horizon "$HORIZON" 2>&1 | tee /tmp/train.log

      - name: Sanity-check artifact
        working-directory: backend
        run: |
          python - <<'PY'
          import json, joblib
          from pathlib import Path
          model_path = Path("models/rf_signal.joblib")
          meta_path  = Path("models/rf_signal.meta.json")
          assert model_path.exists(), f"missing {model_path}"
          assert meta_path.exists(),  f"missing {meta_path}"
          size_mb = model_path.stat().st_size / 1e6
          assert size_mb > 1, f"model suspiciously small: {size_mb:.1f} MB"
          bundle = joblib.load(model_path)
          assert "model" in bundle and "meta" in bundle, "bundle missing keys"
          meta = bundle["meta"]
          # Smoke: predict on a zero vector
          import numpy as np
          x = np.zeros((1, len(meta["feature_names"])), dtype=float)
          proba = bundle["model"].predict_proba(x)
          assert proba.shape == (1, 2), f"bad proba shape: {proba.shape}"
          print(f"OK · size={size_mb:.2f} MB · holdout_acc={meta['holdout_accuracy']} · auc={meta['holdout_auc']} · universe={meta['universe_size']}")
          print(json.dumps({k: meta[k] for k in ("trained_at","universe_size","horizon_days","holdout_accuracy","holdout_auc","oob_score","baseline_accuracy","calibrated_brier","uncalibrated_brier","cutoff_date","training_start_date","training_end_date")}, indent=2))
          PY

      - name: Publish summary
        working-directory: backend
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          meta = json.loads(open("models/rf_signal.meta.json").read())
          print(f"### Random Forest — weekly retrain")
          print(f"- Trained at: `{meta['trained_at']}`")
          print(f"- Universe: `{meta['universe_size']}` tickers")
          print(f"- Horizon: `{meta['horizon_days']}` trading days")
          print(f"- Training window: `{meta['training_start_date']} → {meta['training_end_date']}`")
          print(f"- Walk-forward cutoff: `{meta['cutoff_date']}`")
          print("")
          print(f"| Metric | Value | vs baseline |")
          print(f"|---|---|---|")
          print(f"| Holdout accuracy | `{meta['holdout_accuracy']*100:.2f}%` | baseline `{meta['baseline_accuracy']*100:.2f}%` |")
          print(f"| ROC-AUC | `{meta['holdout_auc']:.3f}` | — |")
          print(f"| OOB score | `{meta['oob_score']*100:.2f}%` | — |")
          print(f"| Brier (calibrated) | `{meta.get('calibrated_brier', 'n/a')}` | uncal `{meta.get('uncalibrated_brier', 'n/a')}` |")
          print("")
          print("**Top-5 feature importance**")
          print("")
          print(f"| # | Feature | Importance |")
          print(f"|---|---|---|")
          for i, f in enumerate(meta["feature_importance"][:5], 1):
              print(f"| {i} | `{f['name']}` | `{f['importance']*100:.2f}%` |")
          PY

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: rf_signal-${{ github.run_id }}
          path: |
            backend/models/rf_signal.joblib
            backend/models/rf_signal.meta.json
          retention-days: 30

      - name: Upload training log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: train-log-${{ github.run_id }}
          path: /tmp/train.log
          retention-days: 14
